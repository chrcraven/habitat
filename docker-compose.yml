# Local dev only. See /CLAUDE.md and /docs/open-questions.md
# ("Hosting/ops model") — production deployment is not decided yet.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habitat}
      POSTGRES_USER: ${POSTGRES_USER:-habitat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habitat}
    volumes:
      - habitat_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  habitat_db_data:
