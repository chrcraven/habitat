# Local dev only — see /CLAUDE.md. Production is a different shape
# entirely (gunicorn and a static nginx, from the `production` stage of
# the same two Dockerfiles, deployed to Kubernetes); there is no compose
# file for it, because the deployment's manifests live outside this repo.
# /docs/deployment-config.md is the contract between the two.
services:
  db:
    # This image tag is load-bearing, and it is why the application's
    # PostGIS requirement went unstated for the life of the project: the
    # `postgis/postgis` image's own init scripts run
    # `CREATE EXTENSION postgis` on first start, so local dev has always
    # had a spatial database without anything in this repo asking for one.
    # No migration creates the extension. Point the backend at a plain
    # `postgres` image, or a managed instance, or an operator-provisioned
    # database, and `migrate` fails at boot with `type "geometry" does not
    # exist`. /docs/deployment-config.md, "The database", has the details
    # and the privilege caveat.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habitat}
      POSTGRES_USER: ${POSTGRES_USER:-habitat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habitat}
    volumes:
      - habitat_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # `target: dev` on both services is required, not decorative: since
  # 2026-09-17 each Dockerfile builds a production image as its *last*
  # stage, so an untargeted build would hand local dev gunicorn and a
  # static nginx instead of runserver and Vite — no autoreload, and the
  # bind mounts below would do nothing.
  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  habitat_db_data:
