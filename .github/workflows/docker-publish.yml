name: Docker build and publish

# Builds the backend and frontend images and pushes them to Docker Hub
# under the chrcraven namespace:
#   cravenator/habitat-backend
#   cravenator/habitat-frontend
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions), a Docker Hub access token rather than your account password:
#   DOCKERHUB_USERNAME - your Docker Hub username (chrcraven)
#   DOCKERHUB_TOKEN     - a Docker Hub access token with read/write scope
#                         (Docker Hub -> Account Settings -> Security ->
#                         New Access Token)
#
# These images are dev-oriented Dockerfiles (see ../../docker-compose.yml
# and CLAUDE.md's "Hosting/ops model" open question) - publishing them
# doesn't imply a production deployment story is decided yet.
#
# Tag policy: a push to main tags the image "latest"; a "vX.Y.Z" tag/
# release push tags it with that version number. Nothing else - no
# branch-name tag, no per-commit-sha tag.
#
# Conditional builds: on a push to main, an image is only rebuilt if the
# files that go into it changed - the "changes" job diffs the push and
# each matrix build is gated on its own folder (backend/** or
# frontend/**). Editing docs, docker-compose.yml, CLAUDE.md, or this
# workflow itself rebuilds nothing, since neither image's build context
# (./backend or ./frontend) includes them. A "vX.Y.Z" tag push or a
# manual workflow_dispatch run always builds BOTH images regardless of
# the diff - a release should publish a complete, matched set.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  # Detect which image's build inputs changed on this push, so a push to
  # main only rebuilds the affected image(s). The gate below also builds
  # both on tag/manual runs, so this job's output is only consulted for
  # branch pushes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: cravenator/habitat-backend
          - name: frontend
            context: ./frontend
            image: cravenator/habitat-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build this image if it's a tag/release push or a manual run (build
      # everything), or - on a push to main - if this image's own folder
      # changed. needs.changes.outputs[matrix.name] indexes "backend"/
      # "frontend" by the matrix entry's name.
      - name: Decide whether to build ${{ matrix.name }}
        id: guard
        run: |
          echo "build=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.name] == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.guard.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.guard.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        if: steps.guard.outputs.build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # Exactly two tag shapes, nothing else (no branch-name or
          # per-commit-sha tags): "latest" on a push to main, and the
          # version number on a "vX.Y.Z" tag/release push.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push ${{ matrix.name }}
        if: steps.guard.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
