name: Docker build and publish

# Builds the backend and frontend images and pushes them to Docker Hub
# under the chrcraven namespace:
#   chrcraven/habitat-backend
#   chrcraven/habitat-frontend
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions), a Docker Hub access token rather than your account password:
#   DOCKERHUB_USERNAME - your Docker Hub username (chrcraven)
#   DOCKERHUB_TOKEN     - a Docker Hub access token with read/write scope
#                         (Docker Hub -> Account Settings -> Security ->
#                         New Access Token)
#
# These images are dev-oriented Dockerfiles (see ../../docker-compose.yml
# and CLAUDE.md's "Hosting/ops model" open question) - publishing them
# doesn't imply a production deployment story is decided yet.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: chrcraven/habitat-backend
          - name: frontend
            context: ./frontend
            image: chrcraven/habitat-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
