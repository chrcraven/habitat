name: Docker build and publish

# Builds the backend and frontend images and pushes them to Docker Hub
# under the chrcraven namespace:
#   cravenator/habitat-backend
#   cravenator/habitat-frontend
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions), a Docker Hub access token rather than your account password:
#   DOCKERHUB_USERNAME - your Docker Hub username (chrcraven)
#   DOCKERHUB_TOKEN     - a Docker Hub access token with read/write scope
#                         (Docker Hub -> Account Settings -> Security ->
#                         New Access Token)
#
# Tag policy: a push to main tags the image "latest"; a "vX.Y.Z" tag/
# release push tags it with that version number. Nothing else - no
# branch-name tag, no per-commit-sha tag.
#
# Build-target policy, and it is the load-bearing half since 2026-09-17:
# each Dockerfile now builds two different images, and WHICH ONE gets
# published is decided by the same signal as the tag.
#
#   push to main  -> --target dev        -> "latest"
#   vX.Y.Z tag    -> --target production -> "1.2.3"
#
# That mapping is the owner's two decisions expressed as one rule.
# habitat.dev.cravenator.com is permanently a dev instance and pulls
# "latest", so "latest" must stay the runserver/Vite image it has always
# been. Production is stood up from a version tag, and a version tag is
# the only thing that should ever produce gunicorn + nginx. Publishing a
# production image on every main push would be harmless but meaningless;
# publishing a dev image under a version tag would put two development
# servers on the public internet, which is precisely what the production
# stages exist to prevent.
#
# Consequence worth knowing before the first release: the production
# stages are never *published* until a tag exists. They are still built
# on every push - .github/workflows/tests.yml builds both without pushing
# - so the first "vX.Y.Z" is exercising a new *publish*, not a new build.
#
# Conditional builds: on a push to main, an image is only rebuilt if the
# files that go into it changed - the "changes" job diffs the push and
# each matrix build is gated on its own folder (backend/** or
# frontend/**). Editing docs, docker-compose.yml, CLAUDE.md, or this
# workflow itself rebuilds nothing, since neither image's build context
# (./backend or ./frontend) includes them. A "vX.Y.Z" tag push or a
# manual workflow_dispatch run always builds BOTH images regardless of
# the diff - a release should publish a complete, matched set.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  # Detect which image's build inputs changed on this push, so a push to
  # main only rebuilds the affected image(s). The gate below also builds
  # both on tag/manual runs, so this job's output is only consulted for
  # branch pushes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: cravenator/habitat-backend
          - name: frontend
            context: ./frontend
            image: cravenator/habitat-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build this image if it's a tag/release push or a manual run (build
      # everything), or - on a push to main - if this image's own folder
      # changed. needs.changes.outputs[matrix.name] indexes "backend"/
      # "frontend" by the matrix entry's name.
      - name: Decide whether to build ${{ matrix.name }}, and as what
        id: guard
        run: |
          echo "build=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.name] == 'true' }}" >> "$GITHUB_OUTPUT"
          echo "target=${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.guard.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.guard.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        if: steps.guard.outputs.build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # Exactly two tag shapes, nothing else (no branch-name or
          # per-commit-sha tags): "latest" on a push to main, and the
          # version number on a "vX.Y.Z" tag/release push.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push ${{ matrix.name }} (${{ steps.guard.outputs.target }})
        if: steps.guard.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ steps.guard.outputs.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the build identity into the image so /api/health/ can
          # report which build is running (D43). The labels above already
          # carry this for `docker inspect`; these make it answerable over
          # HTTP, which is what an operator without cluster access has.
          #
          # `metadata-action`'s `version` output is the semver on a tag push
          # and the literal string "latest" on a push to main — so it is
          # passed only for a tag. Handing "latest" to a field that means
          # "which release is this" would be a confident wrong answer, and
          # the endpoint's contract is that unset reports null. The sha is
          # passed always: it is the only thing that identifies `latest`,
          # which is rebuilt on every push to main.
          #
          # Only the frontend's nginx stage ignores these (it runs no
          # Python); passing an unused build arg is a no-op, and keeping
          # both matrix entries identical is worth more than the saving.
          build-args: |
            HABITAT_VERSION=${{ startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.version || '' }}
            HABITAT_REVISION=${{ github.sha }}
          # Scoped per target as well as per image: the two targets share
          # early layers but diverge, and one cache key for both would have
          # each build evicting the other's tail.
          cache-from: type=gha,scope=${{ matrix.name }}-${{ steps.guard.outputs.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ steps.guard.outputs.target }}
