name: Tests

# Runs the checks every session in this repo's task log performs by hand
# before pushing: the backend's Django checks and test suite against a real
# PostGIS database, the frontend's typecheck and production build, and
# (since 2026-09-17) a build of both images' `production` target — the one
# artifact no session can exercise locally, since the sandbox these run in
# has no Docker daemon.
#
# Why this exists (2026-09-05): the repo acquired its first backend tests on
# 2026-09-04 and nothing ran them. The only workflow here was
# docker-publish.yml, which builds and pushes images without running a test,
# a check, or a typecheck — so a commit that fails `manage.py check` or
# `tsc -b` published exactly as cleanly as one that passes. See
# build-questions.md (2026-09-05, "D4").
#
# Deliberately self-contained: no repository secrets, no hosting decision,
# no target URL. It is green or red on its own merits from the first run.
#
# NOTE ON SCOPE: this workflow does not gate docker-publish.yml. Whether a
# red test run should stop `latest` from publishing is the owner's call
# (the publish workflow's behaviour has been deliberately tuned twice — the
# tag policy on 2026-08-27, the conditional builds on 2026-08-28), and is
# recorded as an open question rather than decided here. To gate it later,
# add a `needs: [backend, frontend]`-style dependency in that workflow, or
# make publishing conditional on this workflow's conclusion.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend (Django + PostGIS)
    runs-on: ubuntu-latest

    # A real PostGIS database, because GeoDjango's PolygonField/PointField
    # can't be exercised against plain PostgreSQL or SQLite. Django's test
    # runner creates its own `test_habitat` database from this one and
    # installs the postgis extension into it, which needs the superuser this
    # image's POSTGRES_USER already is.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: habitat
          POSTGRES_USER: habitat
          POSTGRES_PASSWORD: habitat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habitat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: habitat
      POSTGRES_USER: habitat
      POSTGRES_PASSWORD: habitat
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GeoDjango needs GDAL/GEOS/PROJ on the runner itself, not just in the
      # database — the same system libraries backend/Dockerfile installs.
      - name: Install GDAL/GEOS/PROJ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev binutils

      # 3.12 matches backend/Dockerfile's python:3.12-slim base, so CI runs
      # the interpreter the published image actually ships.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      # Catches a model change that was never turned into a migration —
      # entrypoint.sh only *applies* migrations, it never generates them, so
      # a missing one fails at container start rather than here.
      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Split from the build step on purpose: `npm run build` is
      # `tsc -b && vite build`, and running them separately makes a red run
      # say which half failed instead of just "build failed".
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npx vite build

  production-images:
    name: Production images build
    runs-on: ubuntu-latest

    # Builds both Dockerfiles' `production` target — and does not push.
    #
    # This exists for a specific gap. docker-publish.yml only builds the
    # production stages on a `vX.Y.Z` tag, and as of 2026-09-17 there are
    # zero git tags and zero GitHub releases, so `type=semver` has never
    # fired once. Without this job the first release would be the first
    # time anyone found out whether those stages build at all — at exactly
    # the moment the owner is trying to stand production up.
    #
    # It also covers the two ways the production stages can break without
    # any test noticing: `collectstatic` failing at build time (it runs
    # with no database, which is what makes a build-time collect possible
    # at all), and nginx refusing the config the frontend image copies in.
    #
    # `push: false` and no `target:` guesswork — the target is named
    # explicitly, so this job cannot silently start validating the dev
    # stage instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          push: false
          load: true
          tags: habitat-${{ matrix.name }}:ci
          # Sentinel values, so the step below can prove the build identity
          # actually reaches the image's environment (D43). This plumbing
          # is a Dockerfile property, so no Django test can see it — and
          # the wrong version of it (reading the version from the
          # deployment's own environment with no image default) looks
          # identical in every response until the day somebody forgets to
          # set it.
          build-args: |
            HABITAT_VERSION=9.9.9-ci
            HABITAT_REVISION=ci-sentinel-revision
          cache-from: type=gha,scope=ci-${{ matrix.name }}-production
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}-production

      # Asserts the image runs the server it is supposed to run, which is
      # the whole point of the production stages existing. A stage that
      # built but still started `runserver` or `npm run dev` would be worse
      # than no stage at all, because it would look handled.
      - name: Check ${{ matrix.name }} production image starts the right server
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "backend" ]; then
            docker run --rm --entrypoint sh habitat-backend:ci -c 'gunicorn --version'
            docker run --rm --entrypoint sh habitat-backend:ci -c 'test -f staticfiles/staticfiles.json' \
              || { echo "collectstatic left no manifest in the image"; exit 1; }
            docker image inspect habitat-backend:ci --format '{{ join .Config.Cmd " " }}' | grep -q gunicorn
          else
            docker run --rm --entrypoint sh habitat-frontend:ci -c 'nginx -t'
            docker run --rm --entrypoint sh habitat-frontend:ci -c 'test -f /usr/share/nginx/html/index.html'
            docker run --rm --entrypoint sh habitat-frontend:ci -c 'ls /usr/share/nginx/html/assets/*.js >/dev/null'
          fi

      # The two halves of D43 that live outside Python, so nothing in
      # `manage.py test` can reach them.
      - name: Check ${{ matrix.name }} probe surface
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "backend" ]; then
            # The build identity has to arrive in the image's environment,
            # not just be declared. A missing ARG/ENV pair leaves the
            # endpoint reporting null forever, which is indistinguishable
            # from a correct local build.
            for var in HABITAT_VERSION=9.9.9-ci HABITAT_REVISION=ci-sentinel-revision; do
              docker image inspect habitat-backend:ci \
                --format '{{ range .Config.Env }}{{ println . }}{{ end }}' \
                | grep -qx "$var" \
                || { echo "build identity did not reach the image: expected $var"; exit 1; }
            done
          else
            # The defect itself: /healthz must not be the SPA fallback.
            # Before this, it was byte-identical to a nonexistent path, so
            # a readiness probe pointed at it could never go red.
            docker run -d --name habitat-frontend-probe -p 8088:80 habitat-frontend:ci
            for _ in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:8088/ && break || sleep 1
            done
            curl -fsS http://127.0.0.1:8088/healthz -o health.txt
            curl -fsS http://127.0.0.1:8088/a-path-that-does-not-exist -o fallback.txt
            grep -qx ok health.txt \
              || { echo "/healthz did not return the expected body"; cat health.txt; exit 1; }
            if cmp -s health.txt fallback.txt; then
              echo "/healthz is byte-identical to a nonexistent path — it is the SPA fallback again"
              exit 1
            fi
            # And the fallback must still work, or this "fix" broke routing.
            grep -qi "<!doctype html" fallback.txt \
              || { echo "the SPA fallback stopped serving index.html"; exit 1; }
            # Exactly one Content-Type. The first version of that location
            # used `add_header Content-Type` on top of a `return` that
            # already sets it, and served the header twice — which RFC 9110
            # lets a recipient treat as malformed, on the one endpoint an
            # intermediary polls to decide if this pod is healthy. Every
            # check above passed against it, because nothing looking for a
            # missing thing can see a duplicated one.
            curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8088/healthz
            for header in content-type cache-control; do
              n=$(grep -ci "^$header:" headers.txt || true)
              [ "$n" = "1" ] \
                || { echo "/healthz sent $header $n times, expected once"; cat headers.txt; exit 1; }
            done
            docker rm -f habitat-frontend-probe
          fi
