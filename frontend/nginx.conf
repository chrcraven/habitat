# Serves the built SPA in the `production` stage of ../Dockerfile.
#
# Deliberately a *static file server and nothing else*. It does not proxy
# /api to the backend, and that omission is the design: the moment this
# file names a backend host, the image stops being deployment-neutral and
# the owner's release plan ("tag a version, stand it up") needs a separate
# build per environment. Routing lives in the deployment's own ingress or
# reverse proxy, which already has to exist to terminate TLS.
#
# What that deployment must route to the backend, and why each one:
#   /api/     the whole application API, including the public site's data
#   /admin/   Django admin — load-bearing here, it is the only place the
#             per-tenant custom-HTML kill-switch can be set
#   /static/  Django admin's own CSS and JS, served by WhiteNoise
# Everything else belongs here. docs/deployment-config.md has the table.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression. The stock image ships `#gzip  on;` commented out in its
    # own /etc/nginx/nginx.conf, and this file lands in conf.d/default.conf
    # *inside* that http block — so neither file turned it on and the whole
    # bundle went out uncompressed (D68, 2026-09-25). Measured on this exact
    # config against a real `vite build`, one variable changed: JS
    # 1,153,414 -> 316,551 B, CSS 85,372 -> 13,526 B, first load 3.75x.
    #
    # It went unnoticed because the API beside it *is* compressed (D31's
    # GZipMiddleware), so any spot check that happened to hit an API
    # endpoint answered yes. Check a static asset, not /api/.
    #
    # Three of these six lines are load-bearing and each was measured,
    # because a gzip block that looks right and does nothing is this
    # repo's most-repeated failure (D40, D43, D45, D46, D49, D53):
    #
    #   gzip_proxied any   nginx's default is `off`, which means "do not
    #       compress a request that arrives with a `Via:` header" — i.e.
    #       one that came through a reverse proxy. This image is designed
    #       to sit behind exactly that (see the header comment above), so
    #       without this line compression works on every local spot check
    #       and is silently inert in the real deployment. Measured: with
    #       `Via: 1.1 ingress` and no `gzip_proxied`, the response comes
    #       back 1,153,414 B and no Content-Encoding.
    #
    #   gzip_vary on       adds `Vary: Accept-Encoding`, which nginx does
    #       NOT send otherwise (measured). That is a correctness matter
    #       here rather than hygiene: /assets/ below is served
    #       `public, max-age=31536000, immutable`, so a shared cache with
    #       no Vary may store the gzipped body and hand it to a client
    #       that never asked for it — for a year.
    #
    #   gzip_comp_level 6  nginx defaults to 1. Measured on this bundle:
    #       level 1 = 393,965 B, level 6 = 330,077 B, level 9 = 329,065 B.
    #       So the default gives away 63.9 kB per first load, and 9 buys
    #       1 kB over 6 for noticeably more CPU per request.
    #
    # `text/html` is absent from gzip_types deliberately — nginx always
    # compresses it when gzip is on, and listing it warns. index.html is
    # 392 B anyway, under gzip_min_length. Both JavaScript media types are
    # listed on purpose: this base image labels .js `application/javascript`
    # (verified, not recalled) and newer nginx mime.types use
    # `text/javascript`, so naming only one would stop compressing the
    # bundle on a base-image bump, silently.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # Vite writes content-hashed filenames into /assets, so a given URL's
    # bytes genuinely never change and `immutable` is honest. Note this is
    # NOT the reasoning D33 rejected for photos: a photo's URL is stable
    # while its visibility can be retracted, so caching it hard would put
    # a copy beyond the app's reach. A hashed bundle has no such property
    # to retract — a new build is a new URL.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entry point must never be cached, or a deploy is invisible
    # until every visitor happens to hard-refresh: index.html is the one
    # file whose URL stays the same while its contents change, since it is
    # what names the new hashed bundles.
    #
    # An exact-match location looks like it would only cover a visitor who
    # typed /index.html, which almost nobody does. It covers the real
    # traffic too, because try_files' fallback below is an *internal
    # redirect* and re-runs location matching. Verified rather than
    # reasoned about, against this file and a real build: `/`,
    # `/properties/3` and `/index.html` all come back `no-cache`.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A probe target for THIS container, distinguishable from the fallback
    # below (D43, 2026-09-17).
    #
    # Without it, the natural thing an operator types — a readiness probe on
    # /healthz — hits `location /` and gets the SPA fallback: measured on the
    # dev host as 200 with 549 bytes, **byte-identical to a path that does
    # not exist**. That probe cannot go red while nginx is running, no matter
    # what else is broken, so it reports a healthy pod forever.
    #
    # Be clear about what this does and does not buy, because it is easy to
    # over-read. It proves nginx is up and serving this config. It does NOT
    # prove the backend is reachable, the database is up, or even that the
    # bundle was built — nginx has no idea. **The app's readiness lives on
    # the backend**, at /api/health/ready/, which is where a readiness probe
    # belongs; this one is a liveness check for the web container and
    # nothing more. docs/deployment-config.md, "Health checks and probes",
    # has the mapping.
    #
    # An exact-match location, so it beats the prefix match below rather
    # than depending on ordering. `access_log off` because a kubelet asks
    # every few seconds forever and drowning the log makes the real
    # requests unreadable.
    # `default_type`, not `add_header Content-Type`. The first version of
    # this block used add_header and served **two** identical
    # `Content-Type: text/plain` headers — `return` with a string body sets
    # the type itself, so add_header appends a second. RFC 9110 lets a
    # recipient treat a message with multiple Content-Type fields as
    # malformed, which is a poor property for the one endpoint an
    # intermediary polls to decide whether this pod is healthy. Found by
    # reading the raw response headers; every check that mattered (status,
    # body, byte count, content type) passed against the duplicate,
    # because nothing that looks for a *missing* thing can see a
    # duplicated one.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Client-side routing: any path the app owns has to return index.html
    # rather than 404, because the server has no idea what /properties/3
    # means.
    #
    # Worth knowing before trusting a status code from this app (recorded
    # 2026-09-12 with D23): this is why a mistyped address returns **200**
    # with the app's own not-found screen rather than a real 404. A link
    # checker cannot see a dead in-app address.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
